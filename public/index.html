<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- S3-1 打包适配：移动端全屏 + 安全区 + 禁止缩放（游戏内触摸操作为点按/长按） -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14121a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="骰与篝火">
<meta name="format-detection" content="telephone=no">
<title>骰与篝火 · AI DM 像素跑团</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎲</text></svg>">
</head>
<body>
<div id="app">
  <div id="screen-root"></div>
  <div id="toast-root"></div>
</div>
<script type="module" src="/js/app.mjs"></script>
<script>
// PWA：仅在 http(s) 同源部署、且不在原生壳里时注册 Service Worker。
// 原生壳（Capacitor）的 Web 资源随安装包更新、origin 固定，SW 缓存只会带来「更新后仍是旧界面」的残留问题。
(function () {
  var native = location.protocol === 'capacitor:' || location.protocol === 'file:';
  try {
    var cap = window.Capacitor;
    if (cap && ((typeof cap.isNativePlatform === 'function' && cap.isNativePlatform()) || (cap.getPlatform && cap.getPlatform() !== 'web'))) native = true;
  } catch (e) { /* ignore */ }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !native) {
    window.addEventListener('load', function () {
      // 只有「老外壳已接管本页」时才需要刷新换新：首次安装若也刷新，会打断首屏（登录弹窗等）
      var hadController = !!navigator.serviceWorker.controller;
      var loadedAt = Date.now();
      navigator.serviceWorker.register('/sw.js').then(function (reg) {
        try { reg.update(); } catch (e) { /* ignore */ }
        if (!hadController) return;
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (refreshing) return;
          if (Date.now() - loadedAt > 3000) return; // 已进入操作/对局就不打断
          refreshing = true;
          location.reload();
        });
      }).catch(function () { /* 离线兜底失败不影响游戏 */ });
    });
  }
})();
</script>
</body>
</html>
